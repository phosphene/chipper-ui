# fly.toml — chipper-ui
# Deploy with: flyctl deploy
# Requires FLY_API_TOKEN set as GitHub secret (T-276)

app = 'chipper-ui'
primary_region = 'iad'

[build]

[env]
  PORT = '3000'
  NEXT_PUBLIC_API_URL = 'https://wci-api.fly.dev'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    soft_limit = 200
    hard_limit = 250

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
